<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulation | Investment Log</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="stylesheet" href="assets/world.css" />
  <link rel="stylesheet" href="assets/sim.css" />
  <link rel="stylesheet" href="assets/game.css" />
  <link rel="stylesheet" href="assets/sim-world.css" />
</head>
<body class="sim-page">
  <script>
    // 이 기기의 스크롤바 폭 (겹쳐 뜨는 스크롤바면 0)
    (function () {
      const probe = document.createElement('div');
      probe.style.cssText = 'position:absolute;top:-99px;width:50px;height:50px;overflow:scroll';
      document.body.appendChild(probe);
      document.documentElement.style.setProperty('--sbw', probe.offsetWidth - probe.clientWidth + 'px');
      probe.remove();
    })();
  </script>
  <header>
    <div class="container nav">
      <a class="brand" href="index.html#home" aria-label="Investment Log 홈">
        <span>Investment Log</span>
      </a>
      <nav class="nav-links" aria-label="주요 메뉴">
        <a href="quiz.html">Quiz</a>
        <a href="list.html?type=note">Note</a>
        <a href="list.html?type=method">Method</a>
        <a href="simulation.html">Simulation</a>
      </nav>
    </div>
  </header>

  <main class="sim-world" id="world">
    <!-- 게임 속 배경: 하얀 아이소메트릭 도시 (assets/sim-city.js 가 채움) -->
    <div class="sw-bg" aria-hidden="true"></div>

    <h1 class="sr-only">Simulation</h1>
    <div class="sw-topbar">
      <span class="sw-title">SYSTEMIC RISK GAME</span>
      <div class="mode-tabs" role="tablist" aria-label="시뮬레이션 모드">
        <button class="mode-tab" role="tab" id="tab-game" data-mode="game" aria-controls="gameMode">Game Mode</button>
        <button class="mode-tab" role="tab" id="tab-research" data-mode="research" aria-controls="researchMode">Research Mode</button>
      </div>
      <span class="sw-title right" id="modeHint"></span>
    </div>

    <section id="gameMode" class="sw-view" role="tabpanel" aria-labelledby="tab-game">
      <div class="gm-window float-panel" id="gameWindow">
        <div id="game"></div>
      </div>
    </section>

    <section id="researchMode" class="sw-view" role="tabpanel" aria-labelledby="tab-research" hidden>
      <div class="rm-grid">
        <div class="rm-col rm-left">
          <section class="panel float-panel">
            <h2>1. 시나리오</h2>
            <div class="scenarios" id="scenarios"></div>
          </section>
          <section class="panel float-panel">
            <h2>2. 외부 충격</h2>
            <label class="field">충격 종류<select id="shockSel"></select></label>
            <p class="muted" id="shockDesc" style="margin-top:6px"></p>
            <label class="field">강도 <output id="magV">5</output><input type="range" id="mag" min="1" max="10" value="5" /></label>
            <label class="field">지속 기간 (턴) <output id="durV">3</output><input type="range" id="dur" min="1" max="5" value="3" /></label>
            <button class="btn primary wide" id="shockBtn">충격 투입</button>
            <p class="status" id="shockStatus"></p>
          </section>
          <section class="panel float-panel">
            <h2>3. 정책 개입</h2>
            <div class="policies" id="policies"></div>
            <p class="queued" id="queued"></p>
          </section>
        </div>

        <div class="rm-center">
          <div class="hud">
            <div class="cell float-panel"><small>Turn</small><b id="turn">0</b><div class="progress"><i id="progress"></i></div></div>
            <div class="cell float-panel"><small>시스템 안정도</small><b id="stab">100</b><span class="grade" id="grade">S</span><div class="bar"><i id="stabBar"></i></div></div>
            <div class="cell float-panel"><small>정책 포인트 (PP)</small><b id="points">3</b></div>
            <div class="cell float-panel"><small>목표</small><b class="goal">20턴 버티기</b><span class="muted">안정도 15 미만이면 붕괴</span></div>
          </div>
          <div class="rm-stage">
            <svg id="graph" viewBox="0 40 640 540" role="img" aria-label="기업, 은행, 투자자, 국가의 연결 관계 그래프"></svg>
          </div>
          <div class="controls">
            <button class="btn primary" id="next">다음 턴 ▶</button>
            <button class="btn" id="auto">⏵ 자동 재생</button>
            <button class="btn" id="reset">리셋</button>
          </div>
          <div class="sim-notice">샘플 모델 — 현재 수식은 화면 확인용 임시 값입니다 · 선행연구 기반 업데이트 예정</div>
        </div>

        <div class="rm-col rm-right">
          <section class="panel float-panel" id="detail"></section>
          <section class="panel chart float-panel">
            <h2>노드별 스트레스 추이</h2>
            <svg id="chart" viewBox="0 0 600 190"></svg>
            <div class="legend" id="legend"></div>
          </section>
          <section class="panel float-panel">
            <h2>이벤트 로그</h2>
            <ul class="log" id="log"></ul>
          </section>
        </div>
      </div>
    </section>

    <!-- PC 전체화면이 아닐 때 게임 세계를 가리는 안내 -->
    <div class="sw-gate" id="gate" hidden>
      <div class="sw-gate-box">
        <div class="sw-gate-icon" aria-hidden="true">⛶</div>
        <h2 id="gateTitle"></h2>
        <p id="gateBody"></p>
        <div class="sw-gate-key" id="gateKey" hidden><kbd id="gateKbd">F11</kbd></div>
        <small id="gateHint"></small>
      </div>
    </div>
  </main>

  <div class="overlay" id="overlay" hidden>
    <div class="box">
      <h2 id="ovTitle"></h2>
      <p id="ovBody"></p>
      <button class="btn primary" id="again">다시 시작</button>
    </div>
  </div>

  <script src="assets/chars.js"></script>
  <script src="assets/sim-city.js"></script>
  <script src="assets/sim-model.js"></script>
  <script src="assets/sim.js"></script>
  <script src="assets/game-data.js"></script>
  <script src="assets/game.js"></script>
  <script src="assets/sim-gate.js"></script>
</body>
</html>
