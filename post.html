<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Investment Log</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
  <header>
    <div class="container nav">
      <a class="brand" href="index.html#home" aria-label="Investment Log 홈">
        <span class="brand-mark">I.</span><span>INVESTMENT LOG</span>
      </a>
      <nav class="nav-links" aria-label="주요 메뉴">
        <a href="index.html#research">Research</a>
        <a href="list.html?type=note">Note</a>
        <a href="list.html?type=method">Method</a>
        <a href="simulation.html">Simulation</a>
      </nav>
    </div>
  </header>
  <main class="container post">
    <div class="post-meta" id="meta"></div>
    <h1 id="title">불러오는 중…</h1>
    <article class="post-body" id="body"></article>
    <p style="margin-top:48px"><a class="text-link" id="back" href="list.html?type=note">← 목록으로</a></p>
  </main>
  <footer>
    <div class="container footer-inner"><span>© 2026 INVESTMENT LOG</span><span>Independent research · Not financial advice</span></div>
  </footer>
  <script>
    const slug = new URLSearchParams(location.search).get('p') || '';
    if (!/^(note|method)\/[\w-]+$/.test(slug)) {
      document.getElementById('title').textContent = '글을 찾을 수 없습니다.';
    } else {
      fetch('posts/' + slug + '.md').then(r => { if (!r.ok) throw 0; return r.text(); }).then(txt => {
        const m = txt.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
        const meta = {};
        if (m) m[1].split(/\r?\n/).forEach(l => { const i = l.indexOf(':'); if (i > 0) meta[l.slice(0, i).trim()] = l.slice(i + 1).trim().replace(/^["']|["']$/g, ''); });
        const md = m ? m[2] : txt;
        document.getElementById('back').href = 'list.html?type=' + slug.split('/')[0];
        document.title = (meta.title || slug) + ' | Investment Log';
        document.getElementById('title').textContent = meta.title || slug;
        document.getElementById('meta').textContent = [meta.date && meta.date.replace(/-/g, '.'), slug.split('/')[0].toUpperCase()].filter(Boolean).join(' · ');
        const maths = [];
        const stash = (src, display) => '@@MATH' + (maths.push({ src, display }) - 1) + '@@';
        const prepared = md
          .replace(/\\\$/g, '@@DOLLAR@@')
          .replace(/\$\$([\s\S]+?)\$\$/g, (_, s) => stash(s, true))
          .replace(/\$([^\n$]+?)\$/g, (_, s) => stash(s, false));
        document.getElementById('body').innerHTML = DOMPurify.sanitize(marked.parse(prepared))
          .replace(/@@MATH(\d+)@@/g, (_, i) => katex.renderToString(maths[i].src, { displayMode: maths[i].display, throwOnError: false }))
          .replace(/@@DOLLAR@@/g, () => '$');
      }).catch(() => { document.getElementById('title').textContent = '글을 찾을 수 없습니다.'; });
    }
  </script>
</body>
</html>
