<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="주식, 부동산, 거시경제를 데이터와 논리로 분석하는 개인 투자 리서치 랩." />
  <title>Investment Log | Personal Research Report</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="stylesheet" href="assets/world.css" />
</head>
<body>
  <header>
    <div class="container nav">
      <a class="brand" href="#home" aria-label="Investment Log 홈">
        <span>Investment Log</span>
      </a>
      <nav class="nav-links" aria-label="주요 메뉴">
        <a href="quiz.html">Quiz</a>
        <a href="#research">Research</a>
        <a href="list.html?type=note">Note</a>
        <a href="list.html?type=method">Method</a>
        <a href="simulation.html">Simulation</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero" id="home">
      <h1 class="sr-only">Understand Value. Invest with Evidence.</h1>
    </section>

    <section id="research">
      <div class="container">
        <div class="section-heading">
          <div><h2>Research Areas</h2></div>
        </div>
        <div class="grid">
          <article class="card area-card area-stock"><h3>Stock</h3></article>
          <article class="card area-card area-realestate"><h3>Real Estate</h3></article>
          <article class="card area-card area-market"><h3>Market</h3></article>
        </div>
      </div>
    </section>

    <section class="journal" id="latest">
      <div class="container">
        <div class="section-heading">
          <div><h2>Latest Posts</h2></div>
        </div>
        <div class="journal-list" id="latest-list"><p class="empty">불러오는 중…</p></div>
      </div>
    </section>

    <section id="world">
      <div class="container">
        <div class="section-heading">
          <div><h2>Economy Simulator</h2></div>
        </div>
        <div class="world" id="world-stage">
          <svg viewBox="0 0 800 580" role="img" aria-label="떠 있는 섬 위의 기업, 은행, 투자자, 국가 캐릭터"></svg>
          <div class="world-tip" hidden></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container footer-inner"><span>© 2026 INVESTMENT LOG</span><span>Independent research · Not financial advice</span></div>
  </footer>

  <script>
    const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const render = (id, posts) => {
      const el = document.getElementById(id);
      if (!posts.length) { el.innerHTML = '<p class="empty">아직 글이 없습니다.</p>'; return; }
      el.innerHTML = posts.map(p => `
        <a class="journal-item" href="post.html?p=${encodeURIComponent(p.slug)}">
          <time datetime="${esc(p.date)}">${esc(p.date.replace(/-/g, '.'))}${' · ' + esc((p.type || 'note').toUpperCase())}</time>
          <div><h3>${esc(p.title)}</h3>${p.summary ? `<p>${esc(p.summary)}</p>` : ''}</div>
          <span class="arrow">↗</span>
        </a>`).join('');
    };
    fetch('posts/index.json').then(r => r.json()).then(posts => {
      render('latest-list', posts.slice(0, 3));
    }).catch(() => {
      document.querySelectorAll('.journal-list').forEach(el => {
        el.innerHTML = '<p class="empty">글 목록을 불러오지 못했습니다. (로컬에서는 file:// 대신 서버로 여세요)</p>';
      });
    });
  </script>
  <script src="assets/chars.js"></script>
  <script src="assets/world.js"></script>
</body>
</html>
